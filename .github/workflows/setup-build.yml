name: Build XWalnut installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build unified installer
        run: npm run setup
      - name: Build standalone music installer
        run: npm run music:package
      - uses: actions/upload-artifact@v4
        with:
          name: XWalnut-setup
          path: |
            dist/XWalnut-setup.exe
            dist/XWalnut-setup.exe.sha256
            dist/XWalnut-lively.zip
            dist/XWalnut-music-setup.exe
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/XWalnut-setup.exe
            dist/XWalnut-setup.exe.sha256
            dist/XWalnut-lively.zip
            dist/XWalnut-music-setup.exe
          generate_release_notes: true
